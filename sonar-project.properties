# ─────────────────────────────────────────────────────────────
# sonar-project.properties
# Place this file at the ROOT of the repository (next to main.py)
# ─────────────────────────────────────────────────────────────

# Must match the project key you created in SonarQube/SonarCloud
sonar.projectKey=Intelligent_E_Learning_Platform

# Human-readable name shown in the Sonar UI
sonar.projectName=SmartLearn AI API

# ── Source & exclusions ──────────────────────────────────────

# Scan the backend root (where main.py, auth.py, etc. live)
sonar.sources=backend

# Exclude everything that isn't application code
sonar.exclusions=\
  **/tests/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/node_modules/**,\
  frontend/**

# Tell Sonar which folder holds the tests (for test coverage mapping)
sonar.tests=backend/tests

# ── Language ─────────────────────────────────────────────────
sonar.language=python

# ── Coverage ─────────────────────────────────────────────────
# Path to the coverage.xml produced by pytest-cov in the CI job.
# The file is downloaded into the workspace root before the scan.
sonar.python.coverage.reportPaths=coverage.xml

# ── "Clean as You Code" — scope the Quality Gate to new code ─
# This prevents the gate from failing on pre-existing issues in
# legacy code. Only NEW issues (in the PR diff) are gated.
sonar.qualitygate.wait=true

# ── SonarCloud only (uncomment if using SonarCloud) ──────────
# sonar.organization=your-sonarcloud-org-key
